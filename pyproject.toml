[project]
name = "rfa-tsp"
version = "0.1.0"
description = "Recursive fold algorithm for the travelling-salesman-problem"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    { name = "Robert Nitsch" }
]
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4",
    "rtree>=1.4",
    "scipy>=1.17",
    "shapely>=2.2",
    "tabulate>=0.10",
]

[dependency-groups]
dev = []

[project.scripts]
rfa-tsp = "rfa_tsp.cli:main"
rfa-tsp-benchmark = "rfa_tsp.cli_benchmark:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rfa_tsp"]

[tool.pyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["UP031"]
