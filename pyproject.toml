[project]
name = "recursive-travelling-salesman-algo"
version = "0.1.0"
description = "View and search budgets of German municipalities"
requires-python = ">=3.15, <3.16"
dependencies = [
    "numpy~=2.5",
    "rtree~=1.4",
    "scipy~=1.18",
    "shapely~=2.2",
    "tabulate~=0.10",
]

[dependency-groups]
dev = []

[tool.pyright]
typeCheckingMode = "standard"

[tool.ruff]
line-length = 120
